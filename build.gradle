buildscript {
    repositories {
        jcenter()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'io.github.gradle-nexus:publish-plugin:1.1.0'
    }
}

apply plugin: 'groovy'
apply plugin: 'idea'

// apply plugin: 'io.github.gradle-nexus.publish-plugin'
// apply from: "${rootDir}/publish-root.gradle"
apply from: "${rootDir}/publish-root.hf.gradle"

repositories {
    jcenter()
    google()
}

dependencies {
    compile gradleApi()
    compile localGroovy()
    compile "commons-configuration:commons-configuration:1.10"
    compileOnly 'com.android.tools.build:gradle:4.1.0'
}

java {
    withSourcesJar()
    withJavadocJar()
}

def githubUserName = ext.getFromEnvironment('gpr.user')
def githubUserKey = ext.getFromEnvironment('gpr.key')
def githubOrganization = ext.getFromEnvironment('github.organization') ?: "heliumfoot"

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/${githubOrganization}/swift-android-gradle")
            credentials {
                username = githubUserName
                password = githubUserKey
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            artifactId archivesBaseName
            from components.java
            artifact sourcesJar
        }
    }
}

ext {
    // Provide your own coordinates here
    PUBLISH_GROUP_ID = 'com.heliumfoot.android.swift'
    PUBLISH_ARTIFACT_ID = 'gradle'
    PUBLISH_VERSION = '1.4.0'
}

apply from: "${rootProject.projectDir}/publish-module.hf.gradle"
